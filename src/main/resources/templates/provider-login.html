<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Luxe Salon – Provider Access</title>
    <link rel="stylesheet" th:href="@{/style.css}"/>
    <style>
        .pin-wrap {
            min-height: calc(100vh - 56px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
        }
        .pin-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r);
            box-shadow: var(--shadow-lg);
            padding: 40px 36px;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        .pin-icon {
            width: 52px;
            height: 52px;
            background: var(--blue-light);
            border: 1px solid var(--blue-border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--blue);
            margin: 0 auto 20px;
        }
        .pin-card h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 6px;
        }
        .pin-card p {
            font-size: 13.5px;
            color: var(--muted);
            margin-bottom: 24px;
        }
        .pin-card .form-group { text-align: left; }
        .pin-card .form-group input { letter-spacing: 6px; font-size: 18px; text-align: center; }
        .pin-card button { width: 100%; justify-content: center; margin-top: 4px; padding: 10px; }
        .pin-back { display: block; margin-top: 16px; font-size: 13px; color: var(--muted); text-decoration: none; }
        .pin-back:hover { color: var(--ink); }
    </style>
</head>
<body>

<nav>
    <a href="/" class="nav-brand">Luxe Salon</a>
    <a href="/">Home</a>
    <a href="/slots">Book Appointment</a>
    <a href="/provider">Provider Dashboard</a>
</nav>

<div class="pin-wrap">
    <div class="pin-card">

        <div class="pin-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
        </div>

        <h1>Provider Access</h1>
        <p>Enter your PIN to access the dashboard.</p>
        <p style="font-size:12px; color:var(--blue); background:var(--blue-light); border:1px solid var(--blue-border); border-radius:var(--r-sm); padding:8px 12px; margin-bottom:8px;">
            Demo PIN: 1234 — this is to show that in production, only authorized providers would have access to this dashboard.
        </p>

        <form action="/provider/login" method="post">
            <div class="form-group">
                <label for="pin">PIN</label>
                <input type="password" id="pin" name="pin" placeholder="••••" maxlength="4" required autofocus/>
            </div>
            <button type="submit" class="btn btn-primary">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
                </svg>
                Enter Dashboard
            </button>
        </form>

    </div>
</div>

</body>
</html>
