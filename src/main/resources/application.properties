spring.application.name=starter-demo
server.port=8081
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# --- Datasource (SQLite) ---
spring.datasource.url=jdbc:sqlite:salon.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=1
spring.sql.init.mode=always

# --- Logging ---
# Structured key=value log pattern makes lines grep-able and ingestible by log aggregators
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.level.edu.sjsu.cmpe172.starterdemo=INFO
logging.level.org.springframework.web=WARN
