<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Luxe Salon – Available Slots</title>
    <link rel="stylesheet" th:href="@{/style.css}"/>
</head>
<body>

<nav>
    <a href="/" class="nav-brand">Luxe Salon</a>
    <a href="/">Home</a>
    <a href="/slots">Book Appointment</a>
    <a href="/provider">Provider Dashboard</a>
</nav>

<div class="container">

    <div class="page-title">
        <h1>Available Appointments</h1>
        <p>Select a slot below to book your appointment.</p>
    </div>

    <div class="empty" th:if="${#lists.isEmpty(slots)}">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <p>No available slots at this time. Check back soon.</p>
    </div>

    <div class="table-wrap" th:unless="${#lists.isEmpty(slots)}">
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Stylist</th>
                    <th>Service</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="slot : ${slots}">
                    <td th:text="${slot.slotDate}"></td>
                    <td th:text="${slot.startTime}"></td>
                    <td th:text="${slot.stylistName}"></td>
                    <td th:text="${slot.service}"></td>
                    <td>
                        <a th:href="@{/book/{id}(id=${slot.slotId})}" class="btn btn-accent btn-sm">
                            Book
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
                            </svg>
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
